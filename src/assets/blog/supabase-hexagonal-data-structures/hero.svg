<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
	<title id="title">Supabase hexagonal architecture</title>
	<desc id="desc">A hexagonal architecture diagram around a domain core connected to Supabase adapters, Postgres, RLS, and Edge Functions.</desc>
	<rect width="1200" height="675" fill="#ffffff"/>
	<polygon points="600,112 795,224 795,451 600,563 405,451 405,224" fill="#f8f7f5" stroke="#111" stroke-width="3"/>
	<polygon points="600,221 700,279 700,396 600,454 500,396 500,279" fill="#fff" stroke="#4e8d86" stroke-width="5"/>
	<g fill="#fff" stroke="#111" stroke-width="3">
		<rect x="112" y="282" width="190" height="86" rx="8"/>
		<rect x="898" y="282" width="190" height="86" rx="8"/>
		<rect x="505" y="52" width="190" height="86" rx="8"/>
		<rect x="505" y="537" width="190" height="86" rx="8"/>
	</g>
	<g stroke="#4e8d86" stroke-width="5" stroke-linecap="round" fill="none">
		<path d="M302 325h103"/>
		<path d="M795 325h103"/>
		<path d="M600 138v83"/>
		<path d="M600 454v83"/>
	</g>
	<g fill="#111" font-family="Nunito, Arial, sans-serif" font-size="32" font-weight="800">
		<text x="548" y="350">Domain</text>
		<text x="157" y="335">UI</text>
		<text x="932" y="335">Postgres</text>
		<text x="540" y="105">Adapters</text>
		<text x="552" y="590">RLS</text>
	</g>
	<g fill="#444240" font-family="Courier New, monospace" font-size="22">
		<text x="489" y="486">repositories</text>
		<text x="902" y="398">constraints</text>
	</g>
</svg>
